name: Scheduled Render Deployment

on:
  schedule:
    # Morning deployment: Random times between 6-12am PST
    - cron: '15 14 * * *'  # 6:15am PST (14:15 UTC)
    - cron: '45 16 * * *'  # 8:45am PST (16:45 UTC)
    - cron: '30 19 * * *'  # 11:30am PST (19:30 UTC)
    # Afternoon deployment: Random times between 1-6pm PST
    - cron: '20 21 * * *'  # 1:20pm PST (21:20 UTC)
    - cron: '50 23 * * *'  # 3:50pm PST (23:50 UTC)
    - cron: '25 01 * * *'  # 5:25pm PST (01:25 UTC next day)
  workflow_dispatch:  # Allow manual triggers

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "WARNING: Render credentials not configured. Skipping deployment."
            echo "INFO: Add RENDER_API_KEY and RENDER_SERVICE_ID to GitHub Secrets to enable."
            exit 0
          fi
          
          echo "Triggering Render deployment..."
          curl -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
          
          echo "Deployment triggered successfully!"
      
      - name: Commit deployment record
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Create deployment log
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "Scheduled deployment: ${TIMESTAMP}" >> .deployment-log
          
          # Only commit if there are actual code changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No code changes to commit"
          else
            git add .deployment-log
            git commit -m "Scheduled deployment: ${TIMESTAMP}"
            git push
            echo "Deployment record committed"
          fi
